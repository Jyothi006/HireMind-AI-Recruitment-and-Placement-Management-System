{% extends "base.html" %}

{% block title %}Create User – HireMind Admin{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('admin.users') }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Users
    </a>
    <h2 class="fw-bold mb-1">Create System User</h2>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('admin.create_user') }}">
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" name="full_name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" name="email" required>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Assign Role</label>
            <select class="form-select" name="role" required>
              <option value="candidate">Candidate / Student</option>
              <option value="recruiter">Recruiter / HR</option>
              <option value="tpo">Placement Officer / TPO</option>
              <option value="interviewer">Interviewer</option>
              <option value="hiring_manager">Hiring Manager</option>
              <option value="company_rep">Company Representative</option>
              <option value="admin">System Administrator</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
          Save User Account
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
