{% extends "base.html" %}

{% block title %}Generate Offer – HireMind{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('recruiter.job_applicants', job_id=application.job_id) }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Applicants
    </a>
    <h2 class="fw-bold mb-1">Generate Digital Offer Letter</h2>
    <p class="text-muted mb-0">Candidate: <strong>{{ application.candidate.user.full_name }}</strong> | Company: <strong>{{ application.job.company.name }}</strong></p>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('recruiter.generate_offer', app_id=application.id) }}">
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Job Title</label>
            <input type="text" class="form-control bg-light" value="{{ application.job.title }}" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Salary Package Offered</label>
            <input type="text" class="form-control" name="salary_package" value="{{ application.job.salary_package }}" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Expected Joining Date</label>
            <input type="date" class="form-control" name="joining_date" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Offer Acceptance Deadline</label>
            <input type="date" class="form-control" name="deadline" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Offer Letter Text & Terms</label>
          <textarea class="form-control" name="offer_letter_text" rows="6" required>We are pleased to extend an offer of employment for the position of {{ application.job.title }} at {{ application.job.company.name }}. 

Salary Compensation Package: {{ application.job.salary_package }}.
Location: {{ application.job.location }}.

Please accept or decline this offer before the specified deadline.</textarea>
        </div>

        <button type="submit" class="btn btn-success px-4 py-2 fw-bold shadow-sm">
          <i class="bi bi-send-check-fill me-1"></i> Issue Official Digital Offer
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
