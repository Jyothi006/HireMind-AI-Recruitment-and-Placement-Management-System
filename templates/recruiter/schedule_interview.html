{% extends "base.html" %}

{% block title %}Schedule Interview – HireMind{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('recruiter.job_applicants', job_id=application.job_id) }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Applicants
    </a>
    <h2 class="fw-bold mb-1">Schedule Interview</h2>
    <p class="text-muted mb-0">Candidate: <strong>{{ application.candidate.user.full_name }}</strong> | Job: <strong>{{ application.job.title }}</strong></p>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('recruiter.schedule_interview', app_id=application.id) }}">
        
        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold">Interview Title</label>
            <input type="text" class="form-control" name="title" value="Technical & Coding Assessment Interview" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Interview Type</label>
            <select class="form-select" name="interview_type">
              <option value="Technical" selected>Technical Interview</option>
              <option value="HR">HR Interview</option>
              <option value="Managerial">Managerial Interview</option>
              <option value="Campus Interview">Campus Placement Interview</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Assigned Interviewer</label>
            <select class="form-select" name="interviewer_id" required>
              {% for u in interviewers %}
                <option value="{{ u.id }}">{{ u.full_name }} ({{ u.get_role_display() }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Scheduled Date & Time</label>
            <input type="datetime-local" class="form-control" name="scheduled_time" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Duration (Minutes)</label>
            <input type="number" class="form-control" name="duration_minutes" value="45" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Meeting Link / Room Venue</label>
            <input type="text" class="form-control" name="location_or_link" value="https://meet.hiremind.edu/room-tech-101" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Instructions for Candidate & Interviewer</label>
          <textarea class="form-control" name="instructions" rows="3" placeholder="Please bring updated resume copy and ensure stable internet connectivity for online coding test."></textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
          <i class="bi bi-calendar-check-fill me-1"></i> Confirm & Schedule Interview
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
