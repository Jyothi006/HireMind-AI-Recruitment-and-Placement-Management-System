{% extends "base.html" %}

{% block title %}Company Profile – HireMind{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h2 class="fw-bold mb-1">Corporate & Recruiter Profile</h2>
      <p class="text-muted mb-0">Manage company information displayed to candidates and placement officers.</p>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('recruiter.company_profile') }}">
            
            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-building me-2"></i> Company Information</h5>

            <div class="mb-3">
              <label class="form-label fw-semibold">Company Name</label>
              <input type="text" class="form-control" name="name" value="{{ company.name if company else '' }}" placeholder="TechCorp Solutions" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Website URL</label>
                <input type="url" class="form-control" name="website" value="{{ company.website if company else '' }}" placeholder="https://techcorp.com">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Industry Sector</label>
                <input type="text" class="form-control" name="industry" value="{{ company.industry if company else '' }}" placeholder="Software & IT Services">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Headquarters Location</label>
              <input type="text" class="form-control" name="location" value="{{ company.location if company else '' }}" placeholder="San Francisco, CA or Bangalore">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Company Overview / Description</label>
              <textarea class="form-control" name="description" rows="4" placeholder="Leading software enterprise developing next-gen cloud and AI solutions...">{{ company.description if company else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
              <i class="bi bi-save me-1"></i> Save Company Profile
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}
