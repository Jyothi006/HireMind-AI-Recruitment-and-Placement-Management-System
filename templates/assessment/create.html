{% extends "base.html" %}

{% block title %}Create Assessment – HireMind{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('assessment.list_assessments') }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Assessments
    </a>
    <h2 class="fw-bold mb-1">Create Skill Assessment</h2>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('assessment.create_assessment') }}">
        
        <div class="mb-3">
          <label class="form-label fw-semibold">Assessment Title</label>
          <input type="text" class="form-control" name="title" placeholder="Python & SQL Technical Proficiency Test" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Category</label>
            <select class="form-select" name="category">
              <option value="Aptitude">Aptitude & Reasoning</option>
              <option value="Technical" selected>Technical & Software</option>
              <option value="Programming">Programming & Algorithms</option>
              <option value="General Skill">General Skill Test</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Duration (Minutes)</label>
            <input type="number" class="form-control" name="duration_minutes" value="30" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Passing Marks (%)</label>
            <input type="number" class="form-control" name="pass_marks" value="60" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control" name="description" rows="3" placeholder="This quiz evaluates core Python data structures, SQL queries, and Object-Oriented Programming concepts."></textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
          Create Assessment & Add Questions
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
