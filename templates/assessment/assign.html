{% extends "base.html" %}

{% block title %}Assign Assessment – HireMind{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('recruiter.job_applicants', job_id=application.job_id) }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Applicants
    </a>
    <h2 class="fw-bold mb-1">Assign Skill Assessment</h2>
    <p class="text-muted mb-0">Candidate: <strong>{{ application.candidate.user.full_name }}</strong> | Job: <strong>{{ application.job.title }}</strong></p>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('assessment.assign_assessment', app_id=application.id) }}">
        
        <div class="mb-4">
          <label class="form-label fw-semibold">Select Assessment Quiz</label>
          <select class="form-select form-select-lg" name="assessment_id" required>
            {% for a in assessments %}
              <option value="{{ a.id }}">{{ a.title }} ({{ a.category }} - {{ a.duration_minutes }} mins)</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
          <i class="bi bi-send me-1"></i> Assign Quiz to Candidate
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
