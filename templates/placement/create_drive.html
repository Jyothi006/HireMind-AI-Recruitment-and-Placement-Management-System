{% extends "base.html" %}

{% block title %}Create Drive – HireMind TPO{% endblock %}

{% block content %}
<div class="container-fluid">
  
  <div class="mb-4">
    <a href="{{ url_for('placement.drives') }}" class="btn btn-sm btn-outline-secondary mb-2">
      <i class="bi bi-arrow-left me-1"></i> Back to Drives
    </a>
    <h2 class="fw-bold mb-1">Schedule Campus Placement Drive</h2>
    <p class="text-muted mb-0">Configure company, venue, and multi-factor student eligibility requirements.</p>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="POST" action="{{ url_for('placement.create_drive') }}">
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Participating Company</label>
            <select class="form-select" name="company_id" required>
              {% for c in companies %}
                <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Associated Job Position (Optional)</label>
            <select class="form-select" name="job_id">
              <option value="">-- Direct Campus Recruitment Drive --</option>
              {% for j in jobs %}
                <option value="{{ j.id }}">{{ j.title }} ({{ j.company.name }})</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Placement Drive Title</label>
          <input type="text" class="form-control" name="title" placeholder="Campus Placement Recruitment Drive 2026" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Drive Date</label>
            <input type="date" class="form-control" name="drive_date" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Venue / Platform</label>
            <input type="text" class="form-control" name="venue" value="Main Campus Auditorium & Online Portal" required>
          </div>
        </div>

        <h5 class="fw-bold text-primary mt-4 mb-3"><i class="bi bi-shield-check me-1"></i> Multi-Factor Student Eligibility Rules</h5>

        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Minimum CGPA</label>
            <input type="number" step="0.1" max="10.0" min="0.0" class="form-control" name="min_cgpa" value="6.0" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Max Backlogs Allowed</label>
            <input type="number" min="0" class="form-control" name="max_backlogs" value="0" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Graduation Year</label>
            <input type="number" class="form-control" name="graduation_year" value="2026" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Eligible Branches</label>
            <input type="text" class="form-control" name="eligible_branches" value="Computer Science, Information Technology, Electronics" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
          <i class="bi bi-rocket-takeoff me-1"></i> Publish & Notify Eligible Students
        </button>
      </form>
    </div>
  </div>

</div>
{% endblock %}
