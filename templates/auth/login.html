{% extends "base.html" %}

{% block title %}Login – HireMind{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- HEADER -->
            <div class="login-header">

                <img
                    class="auth-brand-logo"
                    src="{{ url_for('static', filename='images/hiremind-brand.png') }}"
                    alt="HireMind"
                    width="180"
                    height="64"
                >

                <h2>Welcome Back!</h2>

                <p>
                    Sign in to continue to your HireMind account
                </p>

            </div>


            <!-- FORM -->
            <div class="login-body">

                <form method="POST"
                      action="{{ url_for('auth.login') }}">


                    <!-- EMAIL -->
                    <div class="login-field">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="login-input-wrapper">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="login-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="login-input-wrapper">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <!-- ROLE -->
                    <div class="login-field">

                        <label for="role">
                            User Role
                        </label>

                        <div class="login-input-wrapper">

                            <i class="bi bi-person-badge"></i>

                            <select
                                id="role"
                                name="role"
                                onchange="fillDemoCredentials(this)"
                                required
                            >

                                <option value="" selected disabled>
                                    Select your role
                                </option>

                                <option
                                    value="candidate"
                                    data-email="student@hiremind.edu"
                                    data-password="password123">
                                    Candidate / Student
                                </option>

                                <option
                                    value="recruiter"
                                    data-email="recruiter@techcorp.com"
                                    data-password="password123">
                                    Recruiter / HR
                                </option>

                                <option
                                    value="tpo"
                                    data-email="tpo@hiremind.edu"
                                    data-password="password123">
                                    Placement Officer / TPO
                                </option>

                                <option
                                    value="interviewer"
                                    data-email="interviewer@techcorp.com"
                                    data-password="password123">
                                    Interviewer
                                </option>

                                <option
                                    value="hiring_manager"
                                    data-email="hiring@techcorp.com"
                                    data-password="password123">
                                    Hiring Manager
                                </option>

                                <option
                                    value="company_rep"
                                    data-email="rep@innovate.com"
                                    data-password="password123">
                                    Company Representative
                                </option>

                                <option
                                    value="admin"
                                    data-email="admin@hiremind.edu"
                                    data-password="password123">
                                    System Administrator
                                </option>

                            </select>

                        </div>

                        <small class="demo-hint">
                            <i class="bi bi-magic"></i>
                            Select a role to automatically fill demo credentials.
                        </small>

                    </div>


                    <!-- REMEMBER -->
                    <div class="login-options">

                        <label class="remember-me">

                            <input type="checkbox">

                            <span>Remember me</span>

                        </label>

                    </div>


                    <!-- LOGIN -->
                    <button
                        type="submit"
                        class="login-button">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Sign In

                    </button>

                </form>


                <!-- REGISTER -->
                <div class="register-text">

                    Don't have an account?

                    <a href="{{ url_for('auth.register') }}">
                        Register here
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

function fillDemoCredentials(select) {

    const selectedOption =
        select.options[select.selectedIndex];

    const email =
        selectedOption.getAttribute("data-email");

    const password =
        selectedOption.getAttribute("data-password");

    if (email && password) {

        document.getElementById("email").value = email;

        document.getElementById("password").value = password;

    }

}

</script>

{% endblock %}
