{% extends "base.html" %}

{% block title %}Register Account – HireMind{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white p-4 text-center">
          <h3 class="fw-bold mb-0">Create HireMind Account</h3>
          <p class="small opacity-75 mb-0">Select your system role and enter registration details</p>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('auth.register') }}">
            
            <div class="mb-3">
              <label for="full_name" class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label fw-semibold">Select Role</label>
              <select class="form-select" id="role" name="role" onchange="toggleRoleFields()" required>
                <option value="candidate" selected>Candidate / Student</option>
                <option value="recruiter">Recruiter / HR</option>
                <option value="tpo">Placement Officer / TPO</option>
                <option value="interviewer">Interviewer</option>
                <option value="hiring_manager">Hiring Manager</option>
                <option value="company_rep">Company Representative</option>
              </select>
            </div>

            <!-- Candidate Dynamic Fields -->
            <div id="candidate_fields" class="p-3 bg-light rounded-3 mb-3">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-mortarboard me-1"></i> Academic Profile</h6>
              <div class="row g-2">
                <div class="col-md-6 mb-2">
                  <label class="form-label small fw-semibold">Department / Branch</label>
                  <select class="form-select form-select-sm" name="department">
                    <option value="Computer Science">Computer Science & Eng</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electronics">Electronics & Comm Eng</option>
                    <option value="Mechanical">Mechanical Engineering</option>
                    <option value="Civil">Civil Engineering</option>
                  </select>
                </div>
                <div class="col-md-3 mb-2">
                  <label class="form-label small fw-semibold">CGPA (0-10)</label>
                  <input type="number" step="0.1" max="10.0" min="0.0" class="form-control form-control-sm" name="cgpa" value="8.0">
                </div>
                <div class="col-md-3 mb-2">
                  <label class="form-label small fw-semibold">Passout Year</label>
                  <input type="number" class="form-control form-control-sm" name="graduation_year" value="2026">
                </div>
              </div>
            </div>

            <!-- Recruiter Dynamic Fields -->
            <div id="recruiter_fields" class="p-3 bg-light rounded-3 mb-3 d-none">
              <h6 class="fw-bold text-primary mb-3"><i class="bi bi-building me-1"></i> Corporate Details</h6>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Company</label>
                <select class="form-select form-select-sm" name="company_id">
                  <option value="">-- Select Existing Company --</option>
                  {% for comp in companies %}
                    <option value="{{ comp.id }}">{{ comp.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label small fw-semibold">Designation</label>
                <input type="text" class="form-control form-control-sm" name="designation" placeholder="e.g. Senior Talent Acquisition Specialist">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm">
              <i class="bi bi-person-plus-fill me-1"></i> Register Account
            </button>
          </form>

          <div class="text-center mt-3">
            <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Login here</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function toggleRoleFields() {
  const role = document.getElementById('role').value;
  const candFields = document.getElementById('candidate_fields');
  const recFields = document.getElementById('recruiter_fields');

  if (role === 'candidate') {
    candFields.classList.remove('d-none');
    recFields.classList.add('d-none');
  } else if (role === 'recruiter' || role === 'company_rep') {
    candFields.classList.add('d-none');
    recFields.classList.remove('d-none');
  } else {
    candFields.classList.add('d-none');
    recFields.classList.add('d-none');
  }
}
</script>
{% endblock %}
